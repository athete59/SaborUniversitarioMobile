name: CI - Testes e Qualidade Mobile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testes-unitarios-integracao:
    name: 🧪 Testes Unitários e Integração (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm run test:all

  validacao-maestro:
    name: 📱 Validação de Sintaxe dos Fluxos Maestro
    runs-on: ubuntu-latest
    needs: testes-unitarios-integracao

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar CLI do Maestro
        run: |
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Validar integridade dos arquivos YAML da suíte
        run: |
          maestro --version
          ls -la .maestro/
